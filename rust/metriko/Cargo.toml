[package]
name = "metriko"
description = "Quad meshing by quantized global parameterization (Rust port of the metriko C++ library)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["mesh", "quad", "remeshing", "parameterization", "geometry"]
